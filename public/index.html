<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Add Email from .msg</title>
<script src="//api.bitrix24.com/api/v1/"></script>
<style>
  :root {
    color-scheme: light;
    --accent: #2067b0;
    --accent-hover: #1a5590;
    --ok-bg: #e9f7ee;
    --ok-border: #7fc99a;
    --ok-text: #1e6b3a;
    --err-bg: #fdeceb;
    --err-border: #e79690;
    --err-text: #a4231b;
    --text: #24282c;
    --muted: #6b7680;
    --border: #d7dde3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: transparent;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    max-width: 560px;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  p.sub {
    margin: 0 0 14px;
    font-size: 13px;
    color: var(--muted);
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { background: #9fb7cc; cursor: default; }
  input[type="file"] { display: none; }
  .filename {
    font-size: 13px;
    color: var(--muted);
  }
  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.5);
    border-top-color: #fff;
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .banner {
    margin-top: 12px;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.45;
    display: none;
  }
  .banner.ok { display: block; background: var(--ok-bg); border: 1px solid var(--ok-border); color: var(--ok-text); }
  .banner.err { display: block; background: var(--err-bg); border: 1px solid var(--err-border); color: var(--err-text); }
  .banner b { display: block; margin-bottom: 2px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Add email from .msg</h1>
    <p class="sub">Upload an Outlook .msg file to log its content to this deal's timeline.</p>
    <div class="row">
      <button type="button" class="primary" id="pick-btn">📧 Choose .msg file…</button>
      <span class="filename" id="filename"></span>
    </div>
    <input type="file" id="file-input" accept=".msg" />
    <div class="banner" id="banner"></div>
  </div>

<script>
(function () {
  var pickBtn = document.getElementById('pick-btn');
  var fileInput = document.getElementById('file-input');
  var filenameEl = document.getElementById('filename');
  var banner = document.getElementById('banner');

  function showBanner(kind, title, detail) {
    banner.className = 'banner ' + kind;
    banner.innerHTML = '<b>' + escapeHtml(title) + '</b>' + (detail ? escapeHtml(detail) : '');
  }
  function hideBanner() {
    banner.className = 'banner';
    banner.innerHTML = '';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function getDealId() {
    var params = new URLSearchParams(window.location.search);
    var raw = params.get('placement_options');
    if (raw) {
      try {
        var opts = JSON.parse(raw);
        if (opts && opts.ID) return Number(opts.ID);
      } catch (e) { /* fall through */ }
    }
    // Fallback for manual testing outside a real placement: ?dealId=123
    var manual = params.get('dealId');
    return manual ? Number(manual) : null;
  }

  var dealId = getDealId();
  if (!dealId) {
    showBanner('err', 'This app must be opened from a deal’s timeline.', 'No deal was identified for this window.');
    pickBtn.disabled = true;
  }

  pickBtn.addEventListener('click', function () {
    fileInput.value = '';
    fileInput.click();
  });

  fileInput.addEventListener('change', function () {
    var file = fileInput.files[0];
    if (!file) return;
    hideBanner();

    if (!/\.msg$/i.test(file.name)) {
      showBanner('err', 'Only .msg files are supported.', 'Please choose an Outlook email message (.msg) file.');
      return;
    }

    filenameEl.textContent = file.name;
    pickBtn.disabled = true;
    var originalLabel = pickBtn.innerHTML;
    pickBtn.innerHTML = '<span class="spinner"></span>Uploading…';

    var form = new FormData();
    form.append('file', file);
    form.append('dealId', String(dealId));

    fetch('/api/upload-msg', { method: 'POST', body: form })
      .then(function (res) {
        return res.json().then(function (data) { return { status: res.status, data: data }; });
      })
      .then(function (r) {
        if (r.status >= 200 && r.status < 300 && r.data.success) {
          var attSuffix = '';
          if (r.data.attachmentCount > 0) {
            attSuffix = ' · ' + r.data.attachmentsUploaded + '/' + r.data.attachmentCount + ' attachment' + (r.data.attachmentCount === 1 ? '' : 's') + ' uploaded';
          }
          showBanner('ok', '✅ Email added to the timeline', '“' + r.data.subject + '”' + attSuffix);
          filenameEl.textContent = '';
        } else {
          showBanner('err', 'Could not add this email.', (r.data.error && r.data.error.message) || 'Unknown error.');
        }
      })
      .catch(function (e) {
        showBanner('err', 'Could not add this email.', 'Network error: ' + e.message);
      })
      .finally(function () {
        pickBtn.disabled = !dealId;
        pickBtn.innerHTML = originalLabel;
      });
  });

  if (window.BX24) {
    try {
      BX24.init(function () {
        BX24.fitWindow();
      });
    } catch (e) { /* BX24 not available in this context — fine, not required */ }
  }
})();
</script>
</body>
</html>
