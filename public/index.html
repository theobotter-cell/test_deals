<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>New Contact</title>
<link rel="icon" href="/_gw/icon" />
<style>
  :root {
    --blue: #2066b0;
    --blue-dark: #184e87;
    --ink: #1b2733;
    --muted: #67788c;
    --line: #dfe6ee;
    --bg: #f4f6f9;
    --card: #ffffff;
    --danger: #c62f2f;
    --danger-bg: #fdecec;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .brand-icon {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--blue);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px;
  }
  .brand-title { font-size: 15px; font-weight: 600; color: var(--ink); }
  .brand-sub { font-size: 12px; color: var(--muted); }

  .progress {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
  }
  .progress .dot {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    transition: background 0.2s ease;
  }
  .progress .dot.done { background: var(--blue); }
  .progress .dot.current { background: var(--blue-dark); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
  }
  .step-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 6px;
  }
  h1 {
    font-size: 21px;
    margin: 0 0 6px;
  }
  .hint {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 22px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin: 14px 0 6px;
  }
  label:first-of-type { margin-top: 0; }
  input[type=text], input[type=tel], input[type=email], textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(32,102,176,0.12);
  }
  textarea { resize: vertical; min-height: 90px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .field-body { flex: 1; }

  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 26px;
  }
  .actions .left, .actions .right { display: flex; gap: 10px; }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 18px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--blue-dark); }
  .btn-secondary { background: #fff; color: var(--ink); border-color: var(--line); }
  .btn-secondary:hover:not(:disabled) { background: #f6f8fa; }
  .btn-text { background: none; color: var(--muted); padding: 11px 4px; }
  .btn-text:hover:not(:disabled) { color: var(--ink); }

  .toggle-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .toggle-btn {
    flex: 1;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .toggle-btn.active { border-color: var(--blue); color: var(--blue); background: #eef4fb; }

  .company-results {
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .company-results .item {
    padding: 10px 12px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .company-results .item:last-child { border-bottom: none; }
  .company-results .item:hover { background: #f6f8fa; }
  .company-picked {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: #eef4fb;
    border: 1px solid #cfe0f3;
    border-radius: 8px;
    font-size: 14px;
  }
  .company-picked button { padding: 5px 10px; font-size: 12px; }

  .summary-list { border-top: 1px solid var(--line); }
  .summary-row {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .summary-row .k { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; padding-top: 2px; }
  .summary-row .v { font-size: 14px; text-align: right; word-break: break-word; }
  .summary-row .v.empty { color: var(--muted); font-style: italic; }
  .summary-row .edit { font-size: 12px; color: var(--blue); cursor: pointer; margin-left: 10px; white-space: nowrap; }

  .banner {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid #f3c8c8;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .center-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
    padding: 20px 0;
  }
  .check-badge {
    width: 56px; height: 56px; border-radius: 50%;
    background: #e6f4ea; color: #1e7d34;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  .center-state h2 { margin: 0; font-size: 19px; }
  .center-state p { margin: 0; color: var(--muted); font-size: 14px; max-width: 340px; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-icon">B24</div>
    <div>
      <div class="brand-title">New Contact</div>
      <div class="brand-sub" id="sessionLine">&nbsp;</div>
    </div>
  </div>
  <div class="progress" id="progress"></div>
  <div class="card" id="card"></div>
</div>

<script>
(function () {
  var STEPS = ['name', 'phone', 'email', 'company', 'address', 'comments', 'review'];
  var STEP_TITLES = {
    name: 'Full name', phone: 'Phone number', email: 'Email address',
    company: 'Company', address: 'Address', comments: 'Comments', review: 'Review & submit'
  };

  var state = {
    step: 0,
    done: false,
    firstName: '', lastName: '',
    phone: '', email: '',
    companyMode: 'existing', // 'existing' | 'new' | 'none'
    companyId: null, companyTitle: '',
    newCompanyTitle: '',
    address: { line1: '', city: '', region: '', postalCode: '', country: '' },
    comments: '',
    error: null,
    submitting: false,
    result: null,
    session: null,
  };

  var cardEl = document.getElementById('card');
  var progressEl = document.getElementById('progress');
  var sessionLine = document.getElementById('sessionLine');

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }

  function renderProgress() {
    progressEl.innerHTML = '';
    var total = STEPS.length;
    for (var i = 0; i < total; i++) {
      var cls = 'dot';
      if (state.done) cls += ' done';
      else if (i < state.step) cls += ' done';
      else if (i === state.step) cls += ' current';
      progressEl.appendChild(el('div', { class: cls }));
    }
  }

  function goto(stepName) {
    state.step = STEPS.indexOf(stepName);
    state.error = null;
    render();
  }
  function next() { if (state.step < STEPS.length - 1) { state.step++; state.error = null; render(); } }
  function back() { if (state.step > 0) { state.step--; state.error = null; render(); } }

  function fieldStep(opts) {
    var body = el('div', { class: 'field-body' });
    body.appendChild(el('div', { class: 'step-label', text: 'Step ' + (state.step + 1) + ' of ' + STEPS.length }));
    body.appendChild(el('h1', { text: opts.title }));
    if (opts.hint) body.appendChild(el('p', { class: 'hint', text: opts.hint }));
    if (state.error) body.appendChild(el('div', { class: 'banner', text: state.error }));
    body.appendChild(opts.content);

    var actions = el('div', { class: 'actions' });
    var left = el('div', { class: 'left' });
    if (state.step > 0) left.appendChild(el('button', { class: 'btn-secondary', text: 'Back', onclick: back }));
    var right = el('div', { class: 'right' });
    if (opts.skippable) right.appendChild(el('button', { class: 'btn-text', text: 'Skip', onclick: function () { opts.onSkip ? opts.onSkip() : next(); } }));
    right.appendChild(el('button', { class: 'btn-primary', text: opts.nextLabel || 'Next', onclick: function () {
      var err = opts.validate ? opts.validate() : null;
      if (err) { state.error = err; render(); return; }
      if (opts.onNext) opts.onNext();
      next();
    } }));
    actions.appendChild(left);
    actions.appendChild(right);
    body.appendChild(actions);
    return body;
  }

  function textInput(value, placeholder, onInput, type) {
    var i = el('input', { type: type || 'text', placeholder: placeholder || '', value: value || '' });
    i.addEventListener('input', function (e) { onInput(e.target.value); });
    return i;
  }

  function renderName() {
    var content = document.createDocumentFragment();
    content.appendChild(el('label', { text: 'First name' }));
    content.appendChild(textInput(state.firstName, 'e.g. Jordan', function (v) { state.firstName = v; }));
    content.appendChild(el('label', { text: 'Last name' }));
    content.appendChild(textInput(state.lastName, 'e.g. Blake', function (v) { state.lastName = v; }));
    return fieldStep({
      title: 'What\'s the contact\'s name?',
      content: content,
      validate: function () {
        if (!state.firstName.trim() && !state.lastName.trim()) return 'Enter at least a first or last name.';
        return null;
      },
    });
  }

  function renderPhone() {
    var content = document.createDocumentFragment();
    content.appendChild(el('label', { text: 'Phone number' }));
    content.appendChild(textInput(state.phone, '+1 202 555 0123', function (v) { state.phone = v; }, 'tel'));
    return fieldStep({
      title: 'Phone number',
      hint: 'Optional — you can skip this step.',
      content: content,
      skippable: true,
      onSkip: function () { state.phone = ''; },
    });
  }

  function renderEmail() {
    var content = document.createDocumentFragment();
    content.appendChild(el('label', { text: 'Email address' }));
    content.appendChild(textInput(state.email, 'name@company.com', function (v) { state.email = v; }, 'email'));
    return fieldStep({
      title: 'Email address',
      hint: 'Optional — you can skip this step.',
      content: content,
      skippable: true,
      onSkip: function () { state.email = ''; },
      validate: function () {
        if (state.email && !/^\S+@\S+\.\S+$/.test(state.email.trim())) return 'That doesn\'t look like a valid email address.';
        return null;
      },
    });
  }

  var companySearchTimer = null;
  function renderCompany() {
    var content = document.createDocumentFragment();

    var toggleRow = el('div', { class: 'toggle-row' });
    var modes = [['existing', 'Link existing'], ['new', 'New company'], ['none', 'No company']];
    modes.forEach(function (m) {
      var btn = el('button', { class: 'toggle-btn' + (state.companyMode === m[0] ? ' active' : ''), text: m[1], type: 'button' });
      btn.addEventListener('click', function () { state.companyMode = m[0]; render(); });
      toggleRow.appendChild(btn);
    });
    content.appendChild(toggleRow);

    if (state.companyMode === 'existing') {
      if (state.companyId) {
        var picked = el('div', { class: 'company-picked' }, [
          el('span', { text: state.companyTitle }),
          el('button', { class: 'btn-secondary', text: 'Change', onclick: function () { state.companyId = null; state.companyTitle = ''; render(); } }),
        ]);
        content.appendChild(picked);
      } else {
        content.appendChild(el('label', { text: 'Search companies by name' }));
        var searchInput = textInput('', 'Start typing a company name…', function (v) {
          clearTimeout(companySearchTimer);
          var resultsBox = document.getElementById('companyResults');
          if (!v.trim()) { resultsBox.innerHTML = ''; return; }
          companySearchTimer = setTimeout(function () {
            fetch('/api/companies?q=' + encodeURIComponent(v.trim()))
              .then(function (r) { return r.json(); })
              .then(function (d) {
                resultsBox.innerHTML = '';
                (d.data || []).forEach(function (c) {
                  var item = el('div', { class: 'item', text: c.title });
                  item.addEventListener('click', function () {
                    state.companyId = c.id; state.companyTitle = c.title; render();
                  });
                  resultsBox.appendChild(item);
                });
                if (!d.data || !d.data.length) resultsBox.appendChild(el('div', { class: 'item', text: 'No matches' }));
              })
              .catch(function () {});
          }, 300);
        });
        content.appendChild(searchInput);
        content.appendChild(el('div', { class: 'company-results', id: 'companyResults' }));
      }
    } else if (state.companyMode === 'new') {
      content.appendChild(el('label', { text: 'New company name' }));
      content.appendChild(textInput(state.newCompanyTitle, 'e.g. Acme LLC', function (v) { state.newCompanyTitle = v; }));
    } else {
      content.appendChild(el('p', { class: 'hint', text: 'The contact will be created without a linked company.' }));
    }

    return fieldStep({
      title: 'Link a company',
      hint: 'Attach the contact to an existing CRM company, or create a new one.',
      content: content,
      skippable: state.companyMode !== 'none',
      onSkip: function () { state.companyMode = 'none'; state.companyId = null; state.companyTitle = ''; state.newCompanyTitle = ''; },
      validate: function () {
        if (state.companyMode === 'existing' && !state.companyId) return 'Search and select a company, or switch to "New company" / "No company".';
        if (state.companyMode === 'new' && !state.newCompanyTitle.trim()) return 'Enter a name for the new company.';
        return null;
      },
    });
  }

  function renderAddress() {
    var content = document.createDocumentFragment();
    content.appendChild(el('label', { text: 'Street address' }));
    content.appendChild(textInput(state.address.line1, 'Street and building', function (v) { state.address.line1 = v; }));
    var row = el('div', { class: 'row2' });
    var cityBox = document.createDocumentFragment();
    cityBox.appendChild(el('label', { text: 'City' }));
    cityBox.appendChild(textInput(state.address.city, 'City', function (v) { state.address.city = v; }));
    var regionBox = document.createDocumentFragment();
    regionBox.appendChild(el('label', { text: 'State / Region' }));
    regionBox.appendChild(textInput(state.address.region, 'State or region', function (v) { state.address.region = v; }));
    var c1 = el('div', {}, [cityBox]);
    var c2 = el('div', {}, [regionBox]);
    row.appendChild(c1); row.appendChild(c2);
    content.appendChild(row);

    var row2 = el('div', { class: 'row2' });
    var postalBox = document.createDocumentFragment();
    postalBox.appendChild(el('label', { text: 'Postal code' }));
    postalBox.appendChild(textInput(state.address.postalCode, 'Postal code', function (v) { state.address.postalCode = v; }));
    var countryBox = document.createDocumentFragment();
    countryBox.appendChild(el('label', { text: 'Country' }));
    countryBox.appendChild(textInput(state.address.country, 'Country', function (v) { state.address.country = v; }));
    var c3 = el('div', {}, [postalBox]);
    var c4 = el('div', {}, [countryBox]);
    row2.appendChild(c3); row2.appendChild(c4);
    content.appendChild(row2);

    return fieldStep({
      title: 'Address',
      hint: 'Optional — you can skip this step.',
      content: content,
      skippable: true,
    });
  }

  function renderComments() {
    var content = document.createDocumentFragment();
    content.appendChild(el('label', { text: 'Notes about this contact' }));
    var ta = el('textarea', { placeholder: 'Anything worth remembering…' });
    ta.value = state.comments;
    ta.addEventListener('input', function (e) { state.comments = e.target.value; });
    content.appendChild(ta);
    return fieldStep({
      title: 'Comments',
      hint: 'Optional — you can skip this step.',
      content: content,
      skippable: true,
    });
  }

  function summaryRow(label, value, stepName) {
    var row = el('div', { class: 'summary-row' });
    row.appendChild(el('div', { class: 'k', text: label }));
    var right = el('div', {}, []);
    right.style.display = 'flex';
    right.style.alignItems = 'flex-start';
    var v = el('div', { class: 'v' + (value ? '' : ' empty'), text: value || 'Not set' });
    var editLink = el('span', { class: 'edit', text: 'Edit' });
    editLink.addEventListener('click', function () { goto(stepName); });
    right.appendChild(v);
    right.appendChild(editLink);
    row.appendChild(right);
    return row;
  }

  function renderReview() {
    var body = el('div', { class: 'field-body' });
    body.appendChild(el('div', { class: 'step-label', text: 'Step ' + STEPS.length + ' of ' + STEPS.length }));
    body.appendChild(el('h1', { text: 'Review & submit' }));
    body.appendChild(el('p', { class: 'hint', text: 'Confirm everything looks right before creating the contact.' }));
    if (state.error) body.appendChild(el('div', { class: 'banner', text: state.error }));

    var list = el('div', { class: 'summary-list' });
    var fullName = (state.firstName + ' ' + state.lastName).trim();
    list.appendChild(summaryRow('Name', fullName, 'name'));
    list.appendChild(summaryRow('Phone', state.phone, 'phone'));
    list.appendChild(summaryRow('Email', state.email, 'email'));
    var companyLabel = state.companyMode === 'existing' ? state.companyTitle
      : state.companyMode === 'new' ? (state.newCompanyTitle ? state.newCompanyTitle + ' (new)' : '')
      : '';
    list.appendChild(summaryRow('Company', companyLabel, 'company'));
    var a = state.address;
    var addrParts = [a.line1, a.city, a.region, a.postalCode, a.country].filter(Boolean);
    list.appendChild(summaryRow('Address', addrParts.join(', '), 'address'));
    list.appendChild(summaryRow('Comments', state.comments, 'comments'));
    body.appendChild(list);

    var actions = el('div', { class: 'actions' });
    var left = el('div', { class: 'left' }, [
      el('button', { class: 'btn-secondary', text: 'Back', onclick: back, disabled: state.submitting ? 'true' : null }),
    ]);
    var submitBtn = el('button', { class: 'btn-primary', onclick: submitContact });
    submitBtn.disabled = state.submitting;
    if (state.submitting) {
      submitBtn.innerHTML = '<span class="spinner"></span>Creating…';
    } else {
      submitBtn.textContent = 'Create contact';
    }
    var right = el('div', { class: 'right' }, [submitBtn]);
    actions.appendChild(left);
    actions.appendChild(right);
    body.appendChild(actions);
    return body;
  }

  function submitContact() {
    if (state.submitting) return;
    state.submitting = true;
    state.error = null;
    render();

    var payload = {
      firstName: state.firstName.trim(),
      lastName: state.lastName.trim(),
      phone: state.phone.trim(),
      email: state.email.trim(),
      comments: state.comments.trim(),
      address: state.address,
    };
    if (state.companyMode === 'existing' && state.companyId) payload.companyId = state.companyId;
    if (state.companyMode === 'new' && state.newCompanyTitle.trim()) payload.newCompanyTitle = state.newCompanyTitle.trim();

    fetch('/api/contacts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, body: d }; }); })
      .then(function (res) {
        state.submitting = false;
        if (res.status >= 400) {
          state.error = (res.body.error && res.body.error.message) || 'Something went wrong creating the contact.';
          render();
          return;
        }
        state.done = true;
        state.result = res.body;
        render();
      })
      .catch(function (e) {
        state.submitting = false;
        state.error = 'Network error: ' + e.message;
        render();
      });
  }

  function renderDone() {
    var body = el('div', { class: 'field-body center-state' });
    body.appendChild(el('div', { class: 'check-badge', text: '✓' }));
    body.appendChild(el('h2', { text: 'Contact created' }));
    var fullName = (state.firstName + ' ' + state.lastName).trim();
    body.appendChild(el('p', { text: fullName + ' has been added to Bitrix24 CRM.' }));
    if (state.result && state.result.addressWarning) {
      body.appendChild(el('div', { class: 'banner', text: state.result.addressWarning }));
    }
    var actions = el('div', {}, []);
    actions.style.display = 'flex';
    actions.style.gap = '10px';
    actions.style.marginTop = '10px';
    if (state.result && state.result.portal && state.result.id) {
      var openBtn = el('button', { class: 'btn-secondary', text: 'Open in Bitrix24' });
      openBtn.addEventListener('click', function () {
        window.top.location.href = 'https://' + state.result.portal + '/crm/contact/details/' + state.result.id + '/';
      });
      actions.appendChild(openBtn);
    }
    var againBtn = el('button', { class: 'btn-primary', text: 'Create another' });
    againBtn.addEventListener('click', resetWizard);
    actions.appendChild(againBtn);
    body.appendChild(actions);
    return body;
  }

  function resetWizard() {
    state = {
      step: 0, done: false,
      firstName: '', lastName: '', phone: '', email: '',
      companyMode: 'existing', companyId: null, companyTitle: '', newCompanyTitle: '',
      address: { line1: '', city: '', region: '', postalCode: '', country: '' },
      comments: '', error: null, submitting: false, result: null,
      session: state.session,
    };
    render();
  }

  function renderNoSession() {
    var body = el('div', { class: 'field-body center-state' });
    body.appendChild(el('h2', { text: 'Sign-in required' }));
    body.appendChild(el('p', { text: 'Sign in again or grant the app access, then reopen it from the Bitrix24 left menu.' }));
    return body;
  }

  var renderers = {
    name: renderName, phone: renderPhone, email: renderEmail,
    company: renderCompany, address: renderAddress, comments: renderComments, review: renderReview,
  };

  function render() {
    renderProgress();
    cardEl.innerHTML = '';
    if (state.session === false) {
      cardEl.appendChild(renderNoSession());
      return;
    }
    if (state.done) {
      cardEl.appendChild(renderDone());
      return;
    }
    var name = STEPS[state.step];
    cardEl.appendChild(renderers[name]());
  }

  fetch('/api/session').then(function (r) { return r.json(); }).then(function (d) {
    state.session = !!d.authenticated;
    if (d.authenticated && d.user) {
      sessionLine.textContent = 'Signed in as ' + d.user.name;
      var keepAlive = setInterval(function () {
        if (document.visibilityState === 'visible') fetch('/api/ping').catch(function () {});
      }, 4 * 60 * 1000);
    } else {
      sessionLine.textContent = '';
    }
    render();
  }).catch(function () {
    state.session = false;
    render();
  });

  render();

  // Iframe auto-height, harmless when the platform wrapper is off.
  function reportHeight() {
    var h = document.documentElement.scrollHeight;
    window.parent.postMessage({ type: 'vibe:resize', height: h }, '*');
  }
  new MutationObserver(reportHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
  window.addEventListener('resize', reportHeight);
  setTimeout(reportHeight, 100);
})();
</script>
</body>
</html>
